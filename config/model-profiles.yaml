# Named model profiles. Select one with TRAILWARDEN_LLM_PROFILE.
profiles:
  disabled:
    backend_class: NotConfiguredBackend
  local-qwen:
    backend_class: LiteLLMBackend
    model: ollama/qwen2.5:14b
    api_base: http://localhost:11434
    temperature: 0.2
    timeout_seconds: 60
  anthropic-claude:
    backend_class: LiteLLMBackend
    model: anthropic/claude-sonnet-4-6
    temperature: 0.2
    timeout_seconds: 60
  openai-gpt-4o-mini:
    backend_class: LiteLLMBackend
    model: openai/gpt-4o-mini
    temperature: 0.2
    timeout_seconds: 60
